<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Simulation historique de la guerre froide (1947-1990) : dirigez les États-Unis ou l'URSS, étendez votre influence dans le monde sans déclencher l'apocalypse nucléaire.">
<style>[hidden]{display:none!important}html,body{margin:0}img{max-width:100%}</style>
<title>Guerre froide 1947–1990</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Zilla+Slab:wght@600;700&family=Russo+One&family=IBM+Plex+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout : bandeau du camp en tête, dépêches en haut, cartes Action à gauche, planisphère à droite.
   Le jeu assume deux univers visuels fixes (Washington / Kremlin) : couleurs explicites, pas de thème sombre. */
:root{
  --bg:#10151b; --panel:#ffffff; --ink:#14213d; --muted:#55607a; --line:#c5cedb;
  --side:#1f3f7a; --opp:#b5202a; --accent:#ff8f9c; --accent2:#b22234; --head-ink:#ffffff;
  --paper:#ffffff; --paper-dim:#d6dce6; --gold:#b8891a; --ok:#2f6b3a;
  --head-bg:#14213d; --band-bg:#14213d; --stripe:#b22234;
  --usa:#1d4f9f; --urss:#b5202a;
  --f-display:"Zilla Slab",Rockwell,Georgia,serif;
  --f-stencil:"Saira Stencil One",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-type:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:light;
}
.app[data-camp="usa"]{
  --bg:#e7ecf2; --panel:#ffffff; --ink:#14213d; --muted:#55607a; --line:#c5cedb;
  --side:#1f3f7a; --opp:#b5202a; --accent:#ff8f9c; --accent2:#b22234; --head-ink:#ffffff;
  --paper:#ffffff; --paper-dim:#d6dce6;
  --head-bg:linear-gradient(#b22234 0 5px,#ffffff 5px 9px,#b22234 9px 14px,#14213d 14px);
  --band-bg:#14213d; --stripe:repeating-linear-gradient(90deg,#b22234 0 18px,#ffffff 18px 36px);
  --f-display:"Zilla Slab",Rockwell,Georgia,serif;
}
.app[data-camp="urss"]{
  --bg:#e9e3d8; --panel:#f7f3ec; --ink:#1c1515; --muted:#6b5d55; --line:#d3c6b8;
  --side:#b5202a; --opp:#1d4f9f; --accent:#f5cf6a; --accent2:#b5202a; --head-ink:#fff4e0;
  --paper:#f4eee3; --paper-dim:#d8cfc2;
  --head-bg:linear-gradient(115deg,#a3161f 0 64%,#1c1515 64% 66%,#a3161f 66% 100%);
  --band-bg:linear-gradient(115deg,#1c1515 0 72%,#7d1018 72% 100%);
  --stripe:linear-gradient(115deg,#b5202a 0 70%,#f5cf6a 70% 100%);
  --f-display:"Russo One","Arial Black",sans-serif;
}
*{box-sizing:border-box}
body{background:#10151b;color:#14213d;font-family:var(--f-body);font-size:15px;line-height:1.45}
.app{background:var(--bg);color:var(--ink);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.inner{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Écran de choix ---------- */
.choice{min-height:100vh;display:flex;flex-direction:column;background:#10151b;color:#fff}
.choice header{padding-block:24px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.choice h1{margin:0;font-family:var(--f-stencil);font-weight:400;font-size:clamp(42px,7vw,72px);line-height:.9;letter-spacing:.02em}
.choice header > p{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#c9d1db}
.choice .note{font-size:14px;letter-spacing:0;text-transform:none;max-width:560px}
.tries{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.brief{margin-top:14px;max-width:820px;width:100%;text-align:left;background:#eef1f4;color:#18212c;padding:20px 24px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:8px 8px 0 #b8891a;font-size:15.5px;line-height:1.55}
.brief .bdate{align-self:flex-start;border:1.5px solid #18212c;padding:0 8px;font-family:var(--f-type);font-weight:700;font-size:14px;letter-spacing:.06em}
.brief h2{margin:0;font-family:var(--f-type);font-size:clamp(22px,3vw,28px);line-height:1.15;text-wrap:balance}
.brief p{margin:0;max-width:68ch}
.brief .mission{padding:10px 12px;background:rgba(184,137,26,.18);border-left:4px solid #b8891a}
.brief .small{font-size:13px;color:#4f5a67}
.steps{list-style:none;counter-reset:st;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.steps li{counter-increment:st;display:flex;flex-direction:column;gap:3px;font-size:13.5px;line-height:1.35;padding-left:34px;position:relative;min-width:0}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:#18212c;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.steps span{color:#4f5a67}
@media (max-width:640px){.steps{grid-template-columns:1fr}}
.choice .pick{margin:22px 0 0;font-family:var(--f-stencil);font-size:clamp(24px,3.4vw,34px);letter-spacing:.04em;text-transform:none;color:#fff}
.tries span{font-size:12px;padding:3px 10px;border:1px solid #4a5563;color:#dfe5ee}
.halves{flex:1 1 auto;display:flex;flex-wrap:wrap}
.half{flex:1 1 420px;min-width:0;position:relative;overflow:hidden;display:flex;gap:24px;align-items:center;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.half.usa{background:linear-gradient(#b22234 0 6px,#fff 6px 10px,#b22234 10px 16px,#14213d 16px)}
.half.urss{background:linear-gradient(115deg,#a3161f 0 68%,#1c1515 68% 70%,#7d1018 70% 100%)}
.half .emb{flex:0 0 auto;width:clamp(110px,14vw,170px);height:auto}
.half .txt{display:flex;flex-direction:column;gap:14px;min-width:0}
.half .place{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.half.usa .place{color:#ff8f9c} .half.urss .place{color:#f5cf6a}
.half h2{margin:0;font-size:clamp(38px,4.6vw,58px);line-height:.95;font-weight:700}
.half.usa h2{font-family:"Zilla Slab",Rockwell,Georgia,serif}
.half.urss h2{font-family:"Russo One","Arial Black",sans-serif;font-weight:400;color:#fff4e0}
.half p{margin:0;font-size:16px;max-width:440px}
.half.usa p,.half.usa li{color:#dfe5ee} .half.urss p,.half.urss li{color:#f6dcd0}
.half ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:3px}
.go{align-self:flex-start;min-height:48px;padding:0 22px;font-weight:700;font-size:16px;border:0}
.half.usa .go{background:#fff;color:#14213d;box-shadow:5px 5px 0 #b22234}
.half.urss .go{background:#f5cf6a;color:#1c1515;box-shadow:5px 5px 0 #1c1515}
@media (max-width:560px){.half{flex-direction:column;align-items:flex-start}.half .emb{width:96px}}

/* ---------- En-tête du camp ---------- */
.head{background:var(--head-bg);color:var(--head-ink)}
.head .inner{padding-block:16px 12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px}
.brand{display:flex;align-items:flex-end;gap:12px}
.brand svg{width:60px;height:90px;flex:0 0 auto;margin-bottom:-4px}
.brand .t{display:flex;flex-direction:column;gap:3px}
.brand .place{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:34px;line-height:.95}
.app[data-camp="urss"] .brand h1{font-weight:400}
.brand small{font-size:12px;opacity:.88}
.morale{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:4px}
.morale .ends{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.track{position:relative;display:grid;grid-template-columns:repeat(13,1fr);height:26px;border:2px solid var(--head-ink);background:#f7f8f9}
.track span{border-right:1px solid #c3cad2;display:grid;place-items:center;font-size:10px;color:#596574}
.track span:last-child{border-right:0}
.track span:first-child{background:rgba(181,32,42,.35)} .track span:nth-child(13){background:rgba(29,79,159,.35)}
.marker{position:absolute;top:-6px;width:calc(100%/13);height:34px;display:grid;place-items:center;transition:left .7s cubic-bezier(.5,0,.2,1);pointer-events:none}
.marker i{width:20px;height:20px;border-radius:50%;background:#e0b043;border:3px solid #18212c;box-shadow:0 2px 0 #18212c}
.morale .cap{font-size:12px;opacity:.95;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.morale .ends .mine{color:#fff;background:#b5202a;padding:0 6px}
.track span.doom{background:repeating-linear-gradient(45deg,#b5202a 0 4px,#f7f8f9 4px 8px)!important}
.doomtxt{font-weight:700}
.doomtxt.hot{color:#fff;background:#b5202a;padding:0 6px;animation:alarm 1s ease-in-out infinite}
@keyframes alarm{50%{opacity:.55}}
.per{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.per .l{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.per .y{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.app[data-camp="urss"] .per .y{font-weight:400}
.per .r{font-size:12px;opacity:.85}
.hbtns{display:flex;gap:6px;align-self:center}
.hbtn{min-height:40px;padding:0 12px;background:transparent;border:1.5px solid var(--head-ink);color:var(--head-ink);font-size:13px;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.12)}

/* ---------- Bandeau des dépêches (haut) ---------- */
.mainwrap{padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
.band{background:var(--band-bg);color:#f7f8f9;padding:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
.band .lead{flex:0 1 190px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:150px}
.band .lead .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.band .lead .h{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.app[data-camp="urss"] .band .lead .h{font-weight:400}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.on{background:#fff}
.disps{flex:999 1 400px;min-width:0;display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.disp{position:relative;flex:1 1 240px;min-width:0;background:var(--paper-dim);color:#18212c;padding:12px 44px 12px 14px;font-family:var(--f-type);display:flex;flex-direction:column;gap:5px}
.disp.cur{flex:2 1 340px;background:var(--paper);box-shadow:6px 6px 0 var(--accent);padding:14px 48px 14px 16px}
.disp .date{align-self:flex-start;border:1.5px solid #18212c;padding:0 6px;font-weight:700;letter-spacing:.06em;font-size:14px}
.disp h3{margin:0;font-family:var(--f-type);font-size:17px;line-height:1.25;text-wrap:balance}
.disp.cur h3{font-size:23px;line-height:1.15;max-width:82%}
.disp p{margin:0;font-size:14px}
.disp .fx{margin-top:auto;align-self:flex-start;font-family:var(--f-body);font-size:12.5px;font-weight:700;padding:5px 9px;background:rgba(184,137,26,.2);border-left:4px solid var(--gold)}
.disp .fx.none{background:transparent;border-left-color:#9aa3ad;font-weight:400;color:#4f5a67}
.stamp{position:absolute;right:52px;top:12px;transform:rotate(-8deg);border:2.5px solid var(--accent2);color:var(--accent2);padding:1px 8px;font-family:var(--f-body);font-weight:700;font-size:12px;letter-spacing:.12em;opacity:.8;pointer-events:none}
.ibtn{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;padding:0;background:#fff;border:2px solid #18212c;color:#18212c;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:16px;line-height:1;display:grid;place-items:center}
.ibtn:hover{background:#f5e3b5}
.actions{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.actions .hint{color:#dfe5ee;font-size:13px;margin-right:auto}
.res{flex:999 1 400px;min-width:0;background:var(--paper);color:#18212c;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:6px 6px 0 var(--accent)}
.res h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1}
.app[data-camp="urss"] .res h3{font-weight:400}
.res p{margin:0}
.res .calc{font-family:var(--f-type);font-size:15px}
.res table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.res td{padding:4px 0;border-bottom:1px solid #d5dbe2}
.res td:last-child{text-align:right;font-weight:700}

.btn{min-height:44px;padding:0 18px;border:2px solid var(--ink);background:var(--ink);color:var(--panel);font-weight:700}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.side{background:var(--side);border-color:var(--side);color:#fff}
.btn.light{background:#fff;border-color:#fff;color:#18212c}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost-l{background:transparent;color:#fff;border-color:#fff}
.btn.danger{background:var(--urss);border-color:var(--urss);color:#fff}

/* ---------- Bas : cartes + planisphère ---------- */
.bottom{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.handp{flex:1 1 360px;max-width:480px;min-width:0;background:var(--panel);border:2px solid var(--ink);display:flex;flex-direction:column}
.pbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--ink);color:var(--panel);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.handp .body{padding:14px;display:flex;flex-direction:column;gap:12px}
.handp .hint{margin:0;font-size:14px;min-height:40px}
.handp .sub{margin:0;font-size:12px;color:var(--muted)}
.toks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 6px}
@media (max-width:420px){.toks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tw{position:relative;display:flex;justify-content:center}
.tok{background:none;border:0;padding:4px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink);min-width:0}
.tok .disc{position:relative;width:78px;height:78px;border-radius:50%;background:var(--side);display:grid;place-items:center;transition:transform .15s,box-shadow .15s}
.tok .disc svg{width:38px;height:38px}
.tok .disc b{position:absolute;right:-5px;bottom:-5px;width:29px;height:29px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-stencil);font-weight:400;font-size:16px;color:var(--side)}
.tok.mil .disc{outline:3px dashed #18212c;outline-offset:3px}
.tok[aria-pressed="true"] .disc{transform:translateY(-4px);box-shadow:0 0 0 4px var(--panel),0 0 0 7px var(--gold)}
.tok .nm{font-size:12px;font-weight:600;text-align:center;line-height:1.2}
.tok .kd{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tok:disabled{cursor:default}
.tok.spy .disc{background:var(--gold);border:3px dashed #18212c}
.tok.spy .kd{color:#6e5010}
.tok.used{opacity:.45}
.tw .ibtn{top:0;right:2px}
.warn{margin:0;font-size:13px;font-weight:600;color:#b5202a}
.news{margin:0;font-size:13px;font-weight:600;padding:8px 10px;background:rgba(184,137,26,.16);border-left:4px solid var(--gold)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13px}
.checks li::before{content:"○ ";color:var(--muted)}
.checks li.ok::before{content:"● ";color:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.reslist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.reslist li{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;background:var(--bg);font-variant-numeric:tabular-nums}
.reslist li.cur{outline:2px solid var(--gold)}
.reslist b.usa{color:var(--usa)} .reslist b.urss{color:var(--urss)} .reslist b.tie{color:var(--muted)}

.mapp{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:8px}
.mapframe{position:relative;border:2px solid var(--ink);background:#cfd9e2}
svg.map{display:block;width:100%;height:auto}
.map .region{stroke:#eef1ee;stroke-width:.6;transition:fill .9s ease}
.map .region.hot{stroke:#b8891a;stroke-width:2.4}
.map .lead{stroke:#18212c;stroke-width:1;stroke-dasharray:3 3;opacity:.6;fill:none}
.ringw{position:absolute;transform:translate(-50%,-50%);width:7%;min-width:42px;display:flex;flex-direction:column;align-items:center;gap:3px}
.ring{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:rgba(255,255,255,.9);padding:6px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;box-shadow:0 2px 0 rgba(24,33,44,.35)}
button.ring{cursor:pointer}
.ring.target{border:3px dashed var(--gold);box-shadow:0 0 0 5px rgba(184,137,26,.3)}
.ring.target:hover{background:#fff8e3}
.ring.bad{opacity:.55}
.ring.active{border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(184,137,26,.45)}
.ring .plus{font-size:20px;color:var(--muted);line-height:1}
.ring .mt{width:36%;aspect-ratio:1;border-radius:50%;background:var(--side);display:grid;place-items:center}
.ring .mt svg{width:64%;height:64%}
.ring .mt.mil{outline:2px dashed #18212c;outline-offset:1px}
.rlab{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:normal;max-width:132px;text-align:center;justify-content:center;flex-wrap:wrap;line-height:1.25;background:rgba(255,255,255,.88);color:#18212c;padding:0 4px;display:inline-flex;align-items:center;gap:5px}
.pips{display:inline-flex;gap:2px}
.pips i{width:7px;height:7px;border-radius:50%;border:1px solid #9aa3ad;display:block}
.pips i.u{background:var(--usa);border-color:var(--usa)} .pips i.s{background:var(--urss);border-color:var(--urss)}
.opp{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.od{width:19px;height:19px;border-radius:50%;padding:0;border:1px solid #18212c;background:repeating-linear-gradient(45deg,#18212c 0 2px,#f7f8f9 2px 5px);display:grid;place-items:center}
.od.rev{background:var(--opp)}
.od.rev svg{width:12px;height:12px}
.od.mil{outline:1.5px dashed #18212c;outline-offset:1px}
button.od{cursor:pointer;border:2px solid var(--gold);animation:pulse 1.2s ease-in-out infinite}
button.od.rev{border:1px solid #18212c;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(184,137,26,.45)}}
.vpill{font-size:11px;font-weight:700;padding:1px 6px 1px 2px;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.vpill svg{width:15px;height:22px;background:rgba(255,255,255,.18);border-radius:3px}
.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.reslist .emb{width:16px;height:24px;flex:0 0 auto}
.reslist li>span:first-child{display:inline-flex;align-items:center;gap:8px}
.reslist li b{display:inline-flex;align-items:center;gap:6px}
.resrow{flex:999 1 400px;min-width:0;display:flex;gap:16px;align-items:stretch}
.resrow .res{flex:1 1 auto}
.bigemb{flex:0 0 auto;width:72px;align-self:center}
.bigemb svg{width:72px;height:108px;display:block}
.bigemb .tie{width:72px;height:108px;display:grid;place-items:center;font-family:var(--f-stencil);font-size:44px;color:#fff}
.autobar{height:4px;background:rgba(255,255,255,.2);flex:1 1 160px;max-width:260px;position:relative;overflow:hidden}
.autobar i{position:absolute;inset:0;background:var(--accent);transform-origin:left;animation:fill var(--dur,2.4s) linear both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.vpill.usa{background:var(--usa)} .vpill.urss{background:var(--urss)} .vpill.tie{background:#6b7480}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);align-items:center}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-flex;gap:2px}
.sw i{width:14px;height:10px;display:block}

/* ---------- Fenêtres ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.62);display:grid;place-items:center;padding:16px;z-index:70}
.modal{position:relative;background:var(--panel);color:var(--ink);border:3px solid var(--ink);max-width:540px;width:100%;max-height:90vh;overflow:auto;box-shadow:8px 8px 0 var(--side)}
.modal .strip{height:10px;background:var(--stripe)}
.modal .strip.nuke{height:14px;background:repeating-linear-gradient(-45deg,#e0b043 0 12px,#18212c 12px 24px)}
.modal .in{padding:18px 22px 22px;display:grid;gap:13px}
.modal h3{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;line-height:1.1}
.app[data-camp="urss"] .modal h3{font-weight:400}
.modal h4{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.modal p{margin:0}
.modal .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.modal .ex{font-family:var(--f-type);font-size:15px}
.modal .game{display:grid;gap:4px;padding:10px 12px;background:rgba(184,137,26,.16);border-left:4px solid var(--gold)}
.fhead{display:flex;gap:16px;align-items:center}
.fdisc{position:relative;flex:0 0 auto;width:76px;height:76px;border-radius:50%;display:grid;place-items:center}
.fdisc svg{width:38px;height:38px}
.fdisc b{position:absolute;right:-5px;bottom:-5px;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid #18212c;display:grid;place-items:center;font-family:var(--f-stencil);font-weight:400;font-size:17px;color:#18212c}
.fdisc.mil{outline:3px dashed #18212c;outline-offset:3px}
.die{width:84px;height:84px;border:3px solid var(--ink);border-radius:14px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px;margin:4px auto}
.die i{width:14px;height:14px;border-radius:50%;place-self:center}
.die i.on{background:#18212c}
.die.hit{border-color:#b5202a} .die.hit i.on{background:#b5202a}
.die.roll{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.big{font-family:var(--f-stencil);font-size:28px;line-height:1.05;text-align:center}
table.score{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.score td{padding:4px 0;border-bottom:1px solid var(--line)}
table.score td:last-child{text-align:right;font-weight:700}
.risk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1.5px solid var(--ink);font-size:11px;text-align:center}
.risk div{padding:5px 2px;border-right:1px solid var(--line)}
.risk div:last-child{border-right:0}
.risk div.now{background:var(--ink);color:var(--panel);font-weight:700}
.risk b{display:block;font-size:12px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.log b{color:var(--ink)}

/* ---------- Apocalypse ---------- */
.apo{position:fixed;inset:0;z-index:60;overflow:auto;background:radial-gradient(ellipse 70% 60% at 30% 78%,#8a2a0e 0%,#3d1309 38%,#160907 70%,#0c0706 100%);color:#fbe9d4}
.apo .flash{position:absolute;inset:0;background:#fff8e6;pointer-events:none;animation:flash 1.4s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.apo .wrap{position:relative;max-width:1200px;margin:0 auto;min-height:100%;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:24px 56px}
.apo figure{flex:1 1 340px;max-width:560px;margin:0}
.apo figure svg{display:block;width:100%;height:auto;transform-origin:50% 85%;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.015);filter:brightness(1.12)}}
.apo .ember{animation:ember 3.2s linear infinite}
@keyframes ember{from{transform:translateY(0);opacity:.9}to{transform:translateY(-60px);opacity:0}}
.apo section{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:14px}
.apo .k{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#ffb36b}
.apo .lead{margin:0;font-family:var(--f-type);font-size:17px;color:#f2cfae}
.apo h2{margin:0;font-family:var(--f-stencil);font-weight:400;font-size:clamp(42px,6vw,76px);line-height:.95;color:#ffd9a0;text-wrap:balance}
.apo .count{display:flex;flex-direction:column;gap:4px;padding-block:16px;border-top:1px solid rgba(255,191,128,.35);border-bottom:1px solid rgba(255,191,128,.35)}
.apo .num{font-family:var(--f-stencil);font-size:clamp(38px,5.4vw,70px);line-height:1;color:#fff1d6;font-variant-numeric:tabular-nums}
.apo .lbl{font-size:20px;font-weight:600}
.apo .src{font-size:13px;color:#d9b596}
.apo p{margin:0;color:#e8cdb3}
.apo .tryline{font-size:13px;color:#c9a487}
.btn.apo-b{background:#ffcf8a;border-color:#ffcf8a;color:#2a0f08}
.btn.apo-g{background:transparent;border-color:#ffcf8a;color:#ffcf8a}

/* ---------- Prototype 2 : paquet de cartes Action ---------- */
.deckzone{border-radius:6px;transition:background .2s,outline-color .2s;outline:3px dashed transparent;outline-offset:-3px}
.deckzone.over{outline-color:var(--gold);background:rgba(184,137,26,.08)}
.deck{display:flex;flex-direction:column;align-items:center;gap:22px;padding:30px 8px 18px;min-height:190px}
.deckrow{--ov:0px;display:flex;justify-content:center;align-items:flex-end}
.card{--rot:0deg;--ty:0px;position:relative;flex:0 0 auto;width:96px;height:140px;margin-left:calc(var(--ov) * -1);border-radius:10px;background:var(--panel);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.22);transform:translateY(var(--ty)) rotate(var(--rot));transform-origin:50% 130%;transition:transform .18s,box-shadow .18s,opacity .18s;user-select:none;-webkit-user-select:none}
.card:first-child{margin-left:0}
.card:hover,.card:focus-within{transform:translateY(calc(var(--ty) - 18px)) rotate(var(--rot));z-index:5}
.card.sel{transform:translateY(calc(var(--ty) - 24px)) rotate(var(--rot));box-shadow:0 0 0 3px var(--gold),0 8px 0 rgba(0,0,0,.22);z-index:6}
.card.dragging{opacity:.25}
.card .top{position:absolute;inset:0 0 auto 0;height:9px;background:var(--side);border-radius:8px 8px 0 0;pointer-events:none}
.card.mil .top{height:13px;background:repeating-linear-gradient(-45deg,var(--side) 0 5px,#18212c 5px 9px)}
.card .cp{position:absolute;top:15px;left:8px;font-family:var(--f-stencil);font-size:22px;line-height:1;color:var(--side);pointer-events:none}
.card .cbody{position:absolute;inset:0;background:none;border:0;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px 6px 8px;cursor:grab;touch-action:none;color:var(--ink)}
.card .cbody:active{cursor:grabbing}
.card .cdisc{width:52px;height:52px;border-radius:50%;background:var(--side);display:grid;place-items:center;flex:0 0 auto}
.card.mil .cdisc{outline:2px dashed #18212c;outline-offset:2px}
.card .cdisc svg{width:27px;height:27px}
.card .cn{font-size:11.5px;font-weight:700;line-height:1.15;text-align:center}
.card .ck{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:auto}
.card .ibtn{top:13px;right:5px;width:24px;height:24px;font-size:13px;border-width:1.5px}
.card.spyc .top{background:var(--gold)} .card.spyc .cdisc{background:var(--gold);border:2px dashed #18212c}
.card.spyc{border-style:dashed}
.card.spyc.used{opacity:.45}
.card.deal{animation:deal .55s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes deal{from{opacity:0;transform:translate(0,-90px) rotate(-25deg) scale(.6)}}
.dragghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;margin:0!important;box-shadow:0 18px 30px rgba(0,0,0,.35)!important;transition:none!important;animation:none!important}
.ringw.over .ring{border:3px solid var(--gold);background:#fff4d6;transform:scale(1.15)}
.ringw.nogo .ring{border:3px solid #b5202a;background:#fbe2e2}
.ring{transition:transform .15s}
.map .region.over{stroke:#b8891a;stroke-width:3}
.ring .mt{border:0;padding:0;cursor:grab;touch-action:none}
.deckback{position:relative;width:112px;height:160px;margin:14px auto 6px}
.deckback i{position:absolute;inset:0;border-radius:10px;border:2px solid var(--ink);background:var(--side);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.app[data-camp="usa"] .deckback i{background:repeating-linear-gradient(0deg,#b22234 0 8px,#ffffff 8px 16px)}
.app[data-camp="urss"] .deckback i{background:linear-gradient(115deg,#b5202a 0 62%,#1c1515 62% 66%,#b5202a 66%)}
.deckback i:nth-child(1){transform:translate(-8px,6px) rotate(-6deg)}
.deckback i:nth-child(2){transform:translate(-3px,3px) rotate(-2deg)}
.deckback i:nth-child(3){transform:rotate(2deg)}
.deckback .face{position:absolute;inset:0;transform:rotate(2deg);display:grid;place-items:center}
.deckback .face span{width:76px;height:76px;border-radius:50%;background:var(--panel);border:2px solid var(--ink);display:grid;place-items:center}
.deckback .face svg{width:36px;height:54px}
.waitmsg{text-align:center;margin:0;font-size:14px}

/* ---------- Dépêche surgissant de la carte ---------- */
#dpop .dback{position:fixed;inset:0;z-index:55;background:rgba(10,14,22,.42)}
.dpop{position:fixed;left:50%;top:50%;z-index:56;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;transform:translate(-50%,-50%);background:var(--paper);color:#18212c;border:3px solid #18212c;box-shadow:8px 8px 0 var(--accent)}
.dpop .dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;background:var(--band-bg);color:#fff;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.dpop .dhead .dots i{background:rgba(255,255,255,.3)} .dpop .dhead .dots i.on{background:#fff}
.dpop .din{position:relative;padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;font-family:var(--f-type)}
.dpop .dmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.dpop .date{border:1.5px solid #18212c;padding:0 6px;font-weight:700;letter-spacing:.06em;font-size:14px}
.dpop .loc{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-body);font-size:13px;font-weight:600;color:#4f5a67}
.dpop .loc svg{width:14px;height:14px}
.dpop h3{margin:0;font-family:var(--f-type);font-size:25px;line-height:1.15;text-wrap:balance;max-width:85%}
.dpop p{margin:0;font-size:15px}
.dpop .fx{align-self:flex-start;font-family:var(--f-body);font-size:13px;font-weight:700;padding:6px 10px;background:rgba(184,137,26,.2);border-left:4px solid var(--gold)}
.dpop .fx.none{background:transparent;border-left-color:#9aa3ad;font-weight:400;color:#4f5a67}
.dpop details{font-family:var(--f-body);font-size:14px;border-top:1px solid #d5dbe2;padding-top:8px}
.dpop summary{cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.dpop summary::before{content:"i";width:22px;height:22px;border-radius:50%;border:2px solid #18212c;display:grid;place-items:center;font-family:Georgia,serif;font-style:italic;font-size:13px}
.dpop details p{margin-top:8px;font-family:var(--f-type);font-size:14.5px}
.dpop .stamp{top:16px;right:16px}
.map .evm{fill:#b8891a;stroke:#18212c;stroke-width:1.5}
.map .evr{fill:none;stroke:#b8891a;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ripple 1.6s ease-out infinite}
@keyframes ripple{from{transform:scale(.4);opacity:1}to{transform:scale(3.2);opacity:0}}

/* ---------- Page « Et dans la réalité ? » ---------- */
.debrief{position:fixed;inset:0;z-index:62;overflow:auto;background:#eef0f2;color:#18212c}
.debrief .dtop{background:var(--head-bg);color:var(--head-ink)}
.app[data-camp="urss"] .debrief .dtop{background:#a3161f}
.debrief .dtop .inner{padding-block:28px 24px;display:flex;flex-wrap:wrap;gap:20px 32px;align-items:center}
.debrief .dtop svg{width:80px;height:120px;flex:0 0 auto}
.debrief .dtop .t{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 320px}
.debrief .dtop .k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.debrief .dtop h2{margin:0;font-family:var(--f-display);font-size:clamp(36px,5vw,56px);line-height:1;font-weight:700}
.app[data-camp="urss"] .debrief .dtop h2{font-weight:400}
.debrief .dtop p{margin:0;font-size:16px;max-width:60ch}
.debrief .dbody{padding-block:28px 48px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px 40px;align-items:start}
@media (max-width:860px){.debrief .dbody{grid-template-columns:minmax(0,1fr)}}
.debrief h3{margin:0 0 10px;font-family:var(--f-stencil);font-weight:400;font-size:28px;line-height:1.1}
.debrief .real p{margin:0 0 12px;font-size:16px;line-height:1.6;max-width:66ch}
.debrief .cmp{padding:12px 14px;background:#fff;border-left:5px solid var(--gold);font-weight:600;margin-bottom:16px}
.debrief .invite{margin-top:8px;background:#18212c;color:#fff;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.debrief .invite h4{margin:0;font-family:var(--f-stencil);font-weight:400;font-size:24px}
.debrief .invite p{margin:0;color:#dfe5ee}
.chrono{list-style:none;margin:0;padding:0 0 0 2px;display:grid;gap:0;border-left:3px solid #18212c}
.chrono li{position:relative;display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:7px 0 7px 18px;font-size:14.5px;line-height:1.4}
.chrono li::before{content:"";position:absolute;left:-9px;top:11px;width:15px;height:15px;border-radius:50%;background:#7d8794;border:2px solid #eef0f2}
.chrono li.us::before{background:#1d4f9f} .chrono li.su::before{background:#b5202a}

.chlegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:#4f5a67;margin:0 0 10px}
.chlegend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.choice .means{font-size:14px}
.joke{display:flex;gap:12px;align-items:flex-start;margin-top:4px;padding:10px 12px;background:#fff8e3;border:2px dashed var(--gold)}
.joke .jemb{width:30px;height:45px;flex:0 0 auto}
.joke .jk{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#7a5a0e;margin-bottom:3px}

.debrief .propa{padding:12px 14px;background:#fff;border-left:5px solid #18212c}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.apo .flash{opacity:0}}

function pickJoke(){
  S.jokesUsed = S.jokesUsed || [];
  const list = JOKES[S.side];
  let pool = list.map((j,k) => k).filter(k => !S.jokesUsed.includes(k) && list[k].from <= S.pi);
  if (!pool.length) pool = list.map((j,k) => k).filter(k => list[k].from <= S.pi);
  const k = pool[Math.floor(Math.random() * pool.length)];
  S.jokesUsed.push(k);
  return list[k].t;
}

/* ---------- Sauvegarde et essais ---------- */

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SAVE_KEY = "guerre-froide-partie-v3";

function loadMeta(){ try { return JSON.parse(localStorage.getItem(META_KEY)) || {used:0, results:[]}; } catch(e){ return {used:0, results:[]}; } }
function saveMeta(m){ try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch(e){} }

  h += `<path class="region" style="fill:#b5434a" d="${MAP.regions.urss}"><title>URSS</title></path>`;
  for (const r of ORDER) h += `<path class="region" id="m-${r}" data-drop="${r}" d="${MAP.regions[r]}"><title>${esc(REG[r])}</title></path>`;

}
const mixHex = (a,b,p) => "#" + [1,3,5].map(i => Math.round(parseInt(a.slice(i,i+2),16)*p + parseInt(b.slice(i,i+2),16)*(1-p)).toString(16).padStart(2,"0")).join("");
function regionFill(v){ if (!v) return "#bcc2b8"; return mixHex(v>0?"#1d4f9f":"#b5202a", "#bcc2b8", [0,.32,.6,.88][Math.abs(v)]); }

/* ---------- Moral ---------- */
function moveMorale(forSide, n){ const d = forSide==="usa" ? n : -n; S.m = Math.max(-MAXM, Math.min(MAXM, S.m + d)); }

/* ---------- Partie ---------- */
function newGame(side){
  if (META.used >= MAX_TRIES) return;
  META.used++; saveMeta(META);
  S = { attempt:META.used, side, ai:other(side), pi:0, phase:"events", ei:0, m:0,
    inf:{ee:0,eo:0,al:0,ae:0,pmo:0,af:0},
    hands:{usa:["u1","u2","u3","u4","u5","u6","u7","u8","u9"], urss:["s1","s2","s3","s4","s6","s7","s8","s9","s10"]},
    place:null, sel:null, ri:-1, res:{}, wins:{usa:0,urss:0}, log:[], over:null, warn:"", spy:null, nuke:null };
  applyEvent(); render(); window.scrollTo(0,0);
}
const curP = () => PERIODS[S.pi];
function addLog(t){ S.log.unshift(`<b>${curP().y}</b> · ${t}`); }
function applyEvent(){
  const e = curP().ev[S.ei]; if (!e) return;
  if (e.fx){
    const f = e.fx;
    if (f.usa) moveMorale("usa", f.usa);
    if (f.urss) moveMorale("urss", f.urss);
    if (f.tok) for (const r in f.tok) S.inf[r] = Math.max(-3, Math.min(3, S.inf[r] + f.tok[r]));
    if (f.untok) for (const r in f.untok){ if (f.untok[r]==="usa" && S.inf[r]>0) S.inf[r]--; if (f.untok[r]==="urss" && S.inf[r]<0) S.inf[r]++; }
    if (f.peace) S.peacePi = S.pi;
    if (f.add){ const c = CARDS[f.add]; if (!S.hands[c.s].includes(f.add)) S.hands[c.s].push(f.add); }
    if (f.rem){ const c = CARDS[f.rem]; S.hands[c.s] = S.hands[c.s].filter(x => x!==f.rem); }
  }
  addLog(e.t + (e.fxt ? " — " + e.fxt : ""));
}
function nextEvent(){ hideDispatch(); S.ei++; if (S.ei < curP().ev.length){ applyEvent(); render(); return; } startPlacement(); }
let popKey = null, justDealt = false;
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

}

function showDispatch(){

      <span class="fx ${e.fxt?"":"none"}">${e.fxt ? esc(e.fxt) : "Pas de conséquence directe"}</span>
      <details><summary>Pour en savoir plus</summary><p>${esc(e.more)}</p></details>
      <div class="btns"><button class="btn side" id="dGo">${last ? "Fin des dépêches : recevoir vos cartes Action" : "Dépêche suivante"}</button></div>
    </div></article>`;
  box.hidden = false; popKey = key;

  $("dGo").onclick = nextEvent;

      { transform: `translate(-50%,-50%) translate(${dx*0.15}px,${dy*0.15}px) scale(1.04)`, opacity: 1, offset: .75 },
      { transform: "translate(-50%,-50%)", opacity: 1 }
    ], { duration: 850, easing: "cubic-bezier(.2,.8,.2,1)" });
  }
  setTimeout(() => { if ($("dGo")) $("dGo").focus({preventScroll:true}); }, 60);

const emptyPlace = () => ({ee:[],eo:[],al:[],ae:[],pmo:[],af:[]});
function startPlacement(){
  S.phase = "place"; S.sel = null; S.warn = ""; S.ri = -1; S.res = {}; S.wins = {usa:0,urss:0};
  S.place = { usa:emptyPlace(), urss:emptyPlace() };
  S.place[S.ai] = aiPlace(S.ai);
  S.spy = {armed:false, used:false, seen:[]};
  justDealt = true;
  render();
}
const placedIds = side => ORDER.flatMap(r => S.place[side][r]);
const available = () => S.hands[S.side].filter(id => !placedIds(S.side).includes(id));
const allowed = (id, r) => !CARDS[id].only || CARDS[id].only.includes(r);
function placeSelected(r){
  if (!S || S.phase!=="place" || !S.sel) return;
  if (!allowed(S.sel, r)){ S.warn = `« ${CARDS[S.sel].n} » ne peut aller qu'en ${CARDS[S.sel].lim}.`; render(); return; }
  S.place[S.side][r].push(S.sel); S.sel = null; S.warn = ""; render();
}
function unplace(r, id){ if (S.phase!=="place") return; S.place[S.side][r] = S.place[S.side][r].filter(x => x!==id); S.sel = id; render(); }
function placementReady(){ return available().length===0 && ORDER.every(r => S.place[S.side][r].length>0); }
function armSpy(){ if (S.phase!=="place" || S.spy.used) return; S.spy.armed = !S.spy.armed; S.sel = null; S.warn = ""; render(); }
function useSpy(r, idx){
  if (!S.spy || !S.spy.armed || S.spy.used) return;
  const id = S.place[S.ai][r][idx]; if (!id) return;
  S.spy = {armed:false, used:true, seen:[id]};
  addLog(`Espionnage : en ${REG[r]}, ${V().spies.toLowerCase()} a repéré « ${CARDS[id].n} » (${CARDS[id].p}).`);
  render();
  spyReport(r, id);
}
function spyReport(r, id){
  const c = CARDS[id];
  modal(`<span class="k">${V().spyReport} · ${esc(REG[r])}</span>
    <div class="fhead"><span class="fdisc ${c.mil?"mil":""}" style="background:${c.s==="usa"?"#1f3f7a":"#b5202a"}">${ico(c.ic)}<b>${c.p}</b></span>
      <div style="display:grid;gap:4px;min-width:0"><span class="k">Carte ${V().oppAdjf} · ${esc(c.k)} · puissance ${c.p}</span><h3 id="mTitle">${esc(c.n)}</h3></div></div>
    <div style="display:grid;gap:4px"><h4>Ce que signifie ce symbole</h4><p>${esc(ICONMEAN[c.ic]||"")}</p><p>${esc(c.what)}</p></div>
    <div class="game"><h4>Ce que cela change pour vous</h4><p>${V().Opp} ajoutent ${c.p} point${c.p>1?"s":""} en ${esc(REG[r])}. ${c.mil ? `C'est une présence militaire : si vous y placez aussi une carte militaire, il y aura un risque d'escalade nucléaire.` : `Ce n'est pas une carte militaire : elle ne peut pas déclencher d'escalade nucléaire.`}</p></div>
    <div class="btns"><button class="btn side" id="fClose">Compris</button></div>`);
  $("fClose").onclick = closeModal; $("fClose").focus();

/* IA : choisit 3 régions prioritaires, place ses cartes faibles ailleurs */
function aiPlace(side){
  const sign = side==="usa" ? 1 : -1;
  const pr = ORDER.map(r => {
    const mine = S.inf[r]*sign; let s = Math.random()*1.6;
    if (mine < 0) s += 1.4; if (mine > 0 && mine < 3) s += 0.9; if (mine === 3) s -= 0.8;
    if ((side==="urss" && r==="ee") || (side==="usa" && r==="eo")) s += 0.7;
    return {r, s};
  }).sort((a,b) => b.s-a.s);
  const targets = pr.slice(0,3).map(x => x.r), others = pr.slice(3).map(x => x.r);
  const cards = [...S.hands[side]].sort((a,b) => CARDS[a].p - CARDS[b].p || Math.random()-.5);
  const pl = emptyPlace(), sum = r => pl[r].reduce((t,id) => t+CARDS[id].p, 0);
  for (const r of others){ const i = cards.findIndex(id => allowed(id, r)); pl[r].push(cards.splice(i,1)[0]); }
  cards.sort((a,b) => CARDS[b].p - CARDS[a].p);
  for (const id of cards){
    const pool = (targets.some(r => allowed(id,r)) ? targets : ORDER).filter(r => allowed(id,r));
    pool.sort((a,b) => sum(a)-sum(b)); pl[pool[0]].push(id);
  }
  return pl;
}

/* ---------- Résolution ---------- */
function confirmPlacement(){
  if (!placementReady()) return;
  S.phase = "resolve"; S.ri = -1; S.sel = null; if (S.spy) S.spy.armed = false;
  addLog("Déploiement terminé, les cartes sont retournées.");
  nextRegion();
}
const cardSum = (side, r) => S.place[side][r].reduce((t,id)=>t+CARDS[id].p,0);
const tokSum = (side, r) => Math.max(0, (side==="usa"?1:-1)*S.inf[r]);
const total = (side, r) => cardSum(side, r) + tokSum(side, r);
const hasMil = (side, r) => S.place[side][r].some(id => CARDS[id].mil);
let autoT = null;
const AUTO_MS = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? 900 : 2400;
function scheduleNext(){
  clearTimeout(autoT);
  autoT = setTimeout(() => { autoT = null; if (S && S.phase==="resolve" && $("overlay").hidden) nextRegion(); else if (S && S.phase==="resolve") scheduleNext(); }, AUTO_MS());
}
function nextRegion(){
  clearTimeout(autoT); autoT = null;
  if (S.phase!=="resolve") return;
  S.ri++;
  if (S.ri >= ORDER.length){ toBilan(); return; }
  const r = ORDER[S.ri];
  render();
  if (hasMil("usa", r) && hasMil("urss", r)){
    if (S.peacePi === S.pi){ addLog(`${REG[r]} : face-à-face militaire, mais la détente d'Helsinki écarte tout risque d'escalade.`); finishRegion(r); }
    else openNuke(r);
  } else finishRegion(r);
}
function finishRegion(r){
  if (S.res[r]) return;
  S.nuke = null;
  const cu = cardSum("usa",r), ku = tokSum("usa",r), cs = cardSum("urss",r), ks = tokSum("urss",r);
  const tu = cu+ku, ts = cs+ks, before = S.inf[r];
  const w = tu>ts ? "usa" : ts>tu ? "urss" : null;
  if (w==="usa") S.inf[r] = Math.min(3, S.inf[r]+1);
  if (w==="urss") S.inf[r] = Math.max(-3, S.inf[r]-1);
  if (w) S.wins[w]++;
  let what = "";
  if (w){
    const removed = (w==="usa" && before<0) || (w==="urss" && before>0);
    what = removed ? `retire un jeton ${SIDE[other(w)].adj}` : (before===S.inf[r] ? "garde ses 3 jetons (maximum)" : "pose un jeton d'influence");
  }
  S.res[r] = {w, tu, ts, cu, ku, cs, ks, what};
  addLog(`${REG[r]} : ${w ? SIDE[w].n+" l'emporte "+Math.max(tu,ts)+"–"+Math.min(tu,ts)+" et "+what : "égalité "+tu+"–"+ts}.`);
  render();
  scheduleNext();
}
function toBilan(){
  S.phase = "bilan";
  { const d0 = S.wins.usa - S.wins.urss, pw0 = d0>0 ? "usa" : d0<0 ? "urss" : null;
    S.joke = pw0===S.side ? {pi:S.pi, t:pickJoke()} : null; }
  const d = S.wins.usa - S.wins.urss;
  if (d>0) moveMorale("usa", d); else if (d<0) moveMorale("urss", -d);
  addLog(`Bilan : ${S.wins.usa} victoire(s) USA, ${S.wins.urss} victoire(s) URSS${d ? " — curseur moral de "+Math.abs(d)+" vers "+(d>0?"les USA":"l'URSS") : " — curseur inchangé"}.`);
  if (S.m >= MAXM) S.over = {kind:"moral", w:"usa"};
  else if (S.m <= -MAXM) S.over = {kind:"moral", w:"urss"};
  else if (S.pi === PERIODS.length-1) S.over = {kind:"fin", w: S.m>0?"usa":S.m<0?"urss":null};
  render();
}
function nextPeriod(){
  if (S.over){ showEnd(); return; }
  S.pi++; S.ei = 0; S.phase = "events"; S.place = null; S.res = {}; S.ri = -1; S.spy = null;
  applyEvent(); render();
}

/* ---------- Escalade nucléaire ---------- */
const FACES = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const dieHTML = (n, cls="") => `<div class="die ${cls}" id="die">${[...Array(9)].map((_,i)=>`<i class="${(FACES[n]||[]).includes(i)?"on":""}"></i>`).join("")}</div>`;
function riskText(){ const k = curP().risk; return k.length===1 ? "le dé doit faire 6" : `le dé doit faire ${k.slice(0,-1).join(", ")} ou ${k[k.length-1]}`; }
function openNuke(r){
  const mine = S.place[S.side][r].filter(id=>CARDS[id].mil).map(id=>CARDS[id].n+" ("+CARDS[id].p+")").join(", ");
  const theirs = S.place[S.ai][r].filter(id=>CARDS[id].mil).map(id=>CARDS[id].n+" ("+CARDS[id].p+")").join(", ");
  const pct = Math.round(curP().risk.length/6*100);
  const myScore = S.side==="usa" ? S.m : -S.m;
  modal(`<h3 id="mTitle">Escalade en ${esc(REG[r])}</h3>
    <p>${V().troops} (${esc(mine)}) font face à ${V().oppTroops} (${esc(theirs)}). Une troisième guerre mondiale peut éclater.</p>
    <div class="game"><p><b>Risque d'apocalypse en ${curP().y} :</b> ${riskText()} (${pct} %).</p></div>
    ${myScore-2 <= -MAXM ? `<p class="warn">Attention : reculer ferait toucher le fond à votre moral.</p>` : ""}
    <div class="btns"><button class="btn ghost" id="nBack">Reculer : −2 au moral</button><button class="btn side" id="nHold">Tenir bon</button></div>`, "nuke");
  $("nBack").onclick = () => {
    if (S.nuke) return;
    S.nuke = {r, who:S.side}; moveMorale(S.side, -2); save();
    addLog(`${REG[r]} : ${SIDE[S.side].n} recule pour éviter l'escalade (−2 au moral).`);
    nukeAfter(r, `<h3 id="mTitle">Vous reculez</h3><p>Le monde respire. Votre moral recule de 2 cases ; l'affrontement en ${esc(REG[r])} se règle maintenant aux points.</p>`);
  };
  $("nHold").onclick = () => aiNuke(r);
  $("nHold").focus();
}
function aiNuke(r){
  if (S.nuke) return;
  const p = curP().risk.length/6, my = S.ai==="usa" ? S.m : -S.m;
  let prob = 0.2 + p*0.6 + (my>=3?0.2:0) - (my<=-3?0.2:0);
  if (my-2 <= -MAXM) prob = 0;
  if (Math.random() < Math.max(0, Math.min(.9, prob))){
    S.nuke = {r, who:S.ai}; moveMorale(S.ai, -2);
    addLog(`${REG[r]} : ${V().opp} reculent face à votre fermeté (−2 au moral).`); save();
    nukeAfter(r, `<h3 id="mTitle">${V().oppRetreat}</h3><p>Face à votre fermeté, ${V().opp} préfèrent reculer : −2 à leur moral. Votre pari a payé.</p>`);
    return;
  }
  const v = 1+Math.floor(Math.random()*6), hit = curP().risk.includes(v);
  S.nuke = {r, die:v};
  if (hit){ S.over = {kind:"apo", w:null, r, die:v}; addLog(`${REG[r]} : le dé fait ${v}. Apocalypse nucléaire.`); }
  else addLog(`${REG[r]} : le dé fait ${v}. Le monde a eu chaud.`);
  save();
  rollDie(r, v, hit, true);
}
function rollDie(r, v, hit, animate){
  modal(`<h3 id="mTitle">Personne ne cède</h3><p>${V().Opp} tiennent bon aussi. On lance le dé : ${riskText()} pour déclencher l'apocalypse.</p>${dieHTML(1,"roll")}<p class="big" id="dieTxt" style="font-size:16px;font-family:var(--f-body)">Le dé roule…</p>`, "nuke");
  let n = 0; const fast = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const iv = setInterval(() => {
    $("die").outerHTML = dieHTML(1+Math.floor(Math.random()*6), "roll");
    if (++n > (animate && !fast ? 12 : 0)){
      clearInterval(iv);
      $("die").outerHTML = dieHTML(v, hit?"hit":"");
      if (hit){
        $("dieTxt").outerHTML = `<p class="big" style="color:#b5202a">${v} : embrasement</p><div class="btns" style="justify-content:center"><button class="btn danger" id="nEnd">Voir les conséquences</button></div>`;

        $("nGo").onclick = () => { closeModal(); finishRegion(r); };

      }
    }
  }, 85);
}
function resumeNuke(r){
  const k = S.nuke;
  if (!k || k.r!==r){ openNuke(r); return; }
  if (k.die){ rollDie(r, k.die, curP().risk.includes(k.die), false); return; }
  nukeAfter(r, k.who===S.side
    ? `<h3 id="mTitle">Vous avez reculé</h3><p>Votre moral a reculé de 2 cases ; l'affrontement en ${esc(REG[r])} se règle maintenant aux points.</p>`

}

function layoutDeck(){

  const perMax = Math.max(1, Math.floor((W - cw) / minVis) + 1);
  const rows = Math.ceil(n / perMax), per = Math.ceil(n / rows);
  for (let k = 0; k < rows; k++){
    const row = document.createElement("div"); row.className = "deckrow";
    const slice = cards.slice(k * per, (k + 1) * per); slice.forEach(c => row.appendChild(c)); deck.appendChild(row);
    const m = slice.length, ov = m > 1 ? Math.max(0, Math.min(cw - minVis, (m * cw - W) / (m - 1))) : 0;
    row.style.setProperty("--ov", ov + "px");
    const spread = Math.min(18, m * 3.5);
    slice.forEach((c, i) => {
      const t = m > 1 ? i / (m - 1) - .5 : 0;
      c.style.setProperty("--rot", (t * spread).toFixed(1) + "deg");
      c.style.setProperty("--ty", (t * t * 28).toFixed(1) + "px");
    });
  }
}

      ring = `<div class="ring"><span class="plus" aria-hidden="true">·</span></div>`;
    }
    return `<div class="ringw" data-drop="${r}" style="left:${pos[0]}%;top:${pos[1]}%">${ring}<span class="rlab">${esc(REG[r])} ${pips}</span><span class="opp">${opp}</span>${pill}</div>`;
  }).join("");
  $("rings").querySelectorAll("[data-place]").forEach(b => b.onclick = () => placeSelected(b.dataset.place));
  $("rings").querySelectorAll("[data-back]").forEach(b => {
    const [r, id] = b.dataset.back.split("|");
    b.addEventListener("pointerdown", e => startDrag(e, id, r, b));
    b.onclick = () => { if (dragJustEnded) return; moveCard(id, r, "hand"); };
  });
  $("rings").querySelectorAll("[data-oinfo]").forEach(b => b.onclick = () => openCardInfo(b.dataset.oinfo));
  $("rings").querySelectorAll("[data-spy]").forEach(b => b.onclick = () => { const [r,k] = b.dataset.spy.split("|"); useSpy(r, +k); });
}
function render(){
  $("app").dataset.camp = S ? S.side : "none";
  $("choice").hidden = !!S; $("game").hidden = !S;
  if (!S){ renderChoice(); hideDispatch(); return; }
  if (builtFor !== S.side) buildMap(S.side);
  renderHead(); renderBand(); renderHand(); renderMap();
  if (S.phase==="events") showDispatch(); else if (!$("dpop").hidden) hideDispatch();
  save();
}

S = load();
if (S && S.sel) S.sel = null;
render();
if (S){
  if (S.phase==="end" || (S.over && S.over.kind==="apo")) showEnd();
  else if (S.phase==="resolve"){
    const r = ORDER[S.ri];
    if (r && !S.res[r]){ if (hasMil("usa", r) && hasMil("urss", r) && S.peacePi !== S.pi) resumeNuke(r); else finishRegion(r); }
    else scheduleNext();
  }
}
</script>
